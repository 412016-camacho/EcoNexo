spring.application.name=Econexo
spring.profiles.active=dev

###SPRING DOC PROPERTIES (SWAGGER)###
springdoc.packages-to-scan=com.tfi.Econexo.controller
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/swagger-ui.html

###JWT PROPERTIES###
security.jwt.private.key=${PRIVATE_KEY}
security.jwt.user.generator=${USER_GENERATOR}
security.jwt.expiration.minutes =${JWT_EXPIRATION_MINUTES:30}

###JACKSON PROPERTIES###
spring.jackson.property-naming-strategy=SNAKE_CASE

###CLOUDINARY PROPERTIES###
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

###GOOGLE MAPS PROPERTIES###
econexo.google.maps.api-key=${GOOGLE_MAPS_API_KEY}


###CONFIGURATION MAIL (SMTP)###
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
